<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore the custom Buddyfight card collection.">
<title>Disgrace DB</title>
<style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#101018;color:#f4effa;font:1rem/1.55 system-ui,sans-serif}.wrap{width:min(1200px,calc(100% - 48px));margin-inline:auto}.mast{border-bottom:1px solid #31273e;background:#15111d}.brand{height:68px;display:flex;gap:.8rem;align-items:center;font-size:1.18rem;font-weight:750}.brand small{font-size:.88rem;font-weight:500;color:#c8b8d5}.mark{display:grid;place-items:center;background:#382254;color:#e6c4ff;border-radius:11px;width:36px;height:36px}.hero{isolation:isolate;overflow:hidden;position:relative;margin:30px 0 42px;padding:clamp(25px,6vw,76px);min-height:310px;border:1px solid #5b3b7c;border-radius:23px;background:radial-gradient(ellipse at 83% 50%,#692f79,transparent 55%),linear-gradient(110deg,#24203c,#33204e 65%,#291b41)}.hero p{max-width:38ch;color:#e4d7ee}.hero .eyebrow,.eyebrow{font-size:.85rem;letter-spacing:.15em;color:#edc2ff;font-weight:800}.hero h1{margin:0;font:700 clamp(2.8rem,8vw,6rem)/1 Georgia,serif;letter-spacing:-.045em}.action{display:inline-block;margin-top:8px;background:#e4b7fc;color:#271837;font-weight:800;text-decoration:none;padding:.65rem 1rem;border-radius:8px}.crest{z-index:-1;position:absolute;right:9%;top:50%;transform:translateY(-50%) rotate(24deg);width:24%;aspect-ratio:1;display:grid;place-items:center;border-radius:25%;background:linear-gradient(135deg,#eed0ff44,#d49aff07);outline:1px solid #f3cbff55;outline-offset:15px;box-shadow:0 0 70px #e7a5ff42,inset 0 0 48px #e7a5ff33}.crest span{transform:rotate(-24deg);font-size:clamp(4rem,13vw,12rem);color:#f4ceff;text-shadow:0 0 40px #efacff}.section-title{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.4rem 1rem;margin-bottom:14px}.section-title h2,.section-title p{margin:0}.section-title h2{font:700 clamp(1.65rem,4vw,2.4rem) Georgia,serif}.section-title p,footer{color:#c8b8d5}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:.75rem;padding:16px;background:#1d1727;border:1px solid #382e44;border-radius:14px;margin-bottom:20px}.filters label{display:grid;gap:4px;font-size:.875rem;font-weight:650}.filters label:first-child{flex:1 1 240px}.filters input,.filters select,button{color:inherit;font:inherit;background:#15111d;border:1px solid #51445d;border-radius:8px;padding:.55rem .7rem}.filters select{appearance:none;padding-right:2.2rem;background:linear-gradient(45deg,transparent 50%,#ddc3ec 50%) calc(100% - 15px) 54%/5px 5px no-repeat,linear-gradient(135deg,#ddc3ec 50%,transparent 50%) calc(100% - 10px) 54%/5px 5px no-repeat #15111d}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #efc1ff;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:14px}.entry{display:flex;flex-direction:column;min-height:152px;gap:.4rem;padding:16px;color:inherit;text-decoration:none;border:1px solid #463651;border-left:4px solid var(--accent,#c29ce6);border-radius:11px;background:linear-gradient(125deg,#292033,#1a1624)}.entry:hover,.entry:focus-visible{background:#332442;border-color:var(--accent,#c29ce6)}.entry .label{color:var(--accent,#c29ce6);font-size:.85rem;font-weight:750}.entry strong{line-height:1.3;font-size:1.11rem}.entry small{color:#cbbcda;font-size:.87rem;margin-top:auto}.type-1{--accent:#eda19e}.type-2{--accent:#f7cb87}.type-3{--accent:#9dd9cb}.type-4,.type-6{--accent:#aebaff}.type-5{--accent:#e0b2ff}footer{padding-block:35px}dialog{width:min(670px,calc(100% - 30px));max-height:88vh;border:1px solid #7d5c98;border-radius:16px;padding:clamp(16px,4vw,30px);background:#1d1727;color:inherit}dialog::backdrop{background:#0a0711cc}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog h2{font:700 clamp(1.8rem,5vw,2.5rem)/1.12 Georgia,serif;margin-bottom:.35rem}.stats{display:flex;flex-wrap:wrap;gap:10px}.stats div{padding:.45rem .75rem;background:#2d2339;border-radius:8px}.stats dt{font-size:.875rem;color:#d1bfdb}.stats dd{margin:0;font-weight:750}.effect{white-space:pre-wrap;overflow-wrap:anywhere}dialog h3{margin-bottom:.25rem}@media(max-width:640px){.wrap{width:calc(100% - 28px)}.hero{margin-top:16px;min-height:0}.crest{opacity:.32;right:12%}.filters label:not(:first-child){flex:1 1 125px}}
.hero{min-height:0;padding:clamp(24px,4vw,48px);margin-bottom:28px}.hero h1{font-size:clamp(2.6rem,6vw,4.5rem)}.hero p{max-width:none;margin-bottom:0}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,166px),1fr))}.entry{padding:10px;min-height:0}.entry strong{font-size:1rem}.artwork{aspect-ratio:5/7;display:grid;place-items:center;background:#15111d;border-radius:6px;overflow:hidden;text-align:center;color:#c8b8d5;font-size:.875rem}.artwork img{display:block;width:100%;height:100%;object-fit:contain;min-height:0}.pagination{display:flex;align-items:center;justify-content:center;gap:1rem;margin:24px 0}.pagination[hidden]{display:none}button:disabled{opacity:.45;cursor:default}dialog{width:min(890px,calc(100% - 30px))}#card-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:22px;margin-top:16px;align-items:start}.card-info h2{margin-top:0}.flavor{color:#c8b8d5;font-style:italic}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#card-content{grid-template-columns:1fr}#card-content .artwork{width:min(210px,100%);margin-inline:auto}}
.card-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card-form label{display:grid;gap:4px;min-width:0;font-weight:650}.card-form input,.card-form select,.card-form textarea{min-width:0;width:100%;color:inherit;background:#15111d;border:1px solid #51445d;border-radius:8px;padding:.55rem .7rem;font:inherit}.card-form .wide,.new-stats{grid-column:1/-1}.new-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.new-stats label[hidden]{display:none}#create-feedback{margin:0;color:#f7cb87}#creator-title{margin-top:0}@media(max-width:540px){.card-form,.new-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

</head>
<body>
<header class="mast"><div class="wrap brand"><span class="mark" aria-hidden="true">✦</span><span>Buddyfight<small> Custom Cards</small></span></div></header>
<main class="wrap">
<section class="hero"><h1>Disgrace DB</h1><p>Browse your Buddyfight collection by name, effect, card ID, or world.</p><button class="action" id="create-card" type="button">Create Card</button> <a class="action" style="background:#b4d8ff" href="./publisher.html">Batch Import &amp; Publish</a></section>
<section id="collection" aria-labelledby="browse"><div class="section-title"><h2 id="browse" tabindex="-1">Explore the collection</h2><p id="count" role="status"></p></div>
<form id="filters" class="filters" role="search"><label>Search<input id="search" type="search" placeholder="Name, effect, or card ID"></label><label>World or attribute<select id="world"><option value="">All worlds and attributes</option></select></label><label>Card type<select id="type"><option value="">All types</option></select></label><label>Sort by<select id="sort"><option value="id">Card ID</option><option value="name">Name A-Z</option></select></label><button type="reset">Clear filters</button></form>
<div id="cards" class="grid"></div>
<nav class="pagination" id="pagination" aria-label="Card results pages"><button id="previous" type="button">Previous</button><span id="page-status" role="status"></span><button id="next" type="button">Next</button></nav>
<noscript>Enable JavaScript to browse the card collection.</noscript>
</section>
</main>
<footer class="wrap">Disgrace DB · Custom collection</footer>
<dialog id="detail" aria-labelledby="card-title"><div class="dialog-top"><span class="eyebrow">CARD DETAILS</span><button id="close" type="button" autofocus>Close</button></div><div id="card-content"></div></dialog>
<dialog id="creator" aria-labelledby="creator-title">
  <div class="dialog-top"><h2 id="creator-title">Create Card</h2><button type="button" id="cancel-create">Cancel</button></div>
  <form id="card-form" class="card-form">
    <label>Card name<input name="name" maxlength="120" required autofocus></label>
    <label>Card type<select name="type" id="new-type" required></select></label>
    <label>World or collection<input name="collection" maxlength="80" list="collection-names" placeholder="e.g. Star Dragon World"></label>
    <datalist id="collection-names"></datalist>
    <label>Attributes<input name="attributes" maxlength="200" placeholder="e.g. STG, REbellion, Lightning"></label>
    <div id="new-stats" class="new-stats">
      <label>Size<input name="size" type="number" step="1"></label>
      <label>Power<input name="power" type="number" step="1"></label>
      <label>Defense<input name="defense" type="number" step="1"></label>
      <label>Critical<input name="critical" type="number" step="1"></label>
    </div>
    <label class="wide">Rules text<textarea name="effect" rows="5" maxlength="12000"></textarea></label>
    <label class="wide">Artwork <span>(optional)</span><input name="art" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
    <p id="create-feedback" class="wide" role="status"></p>
    <button class="action" id="save-card" type="submit">Save Card</button>
  </form>
</dialog>
<script src="./cards-data.js"></script>
<script>"use strict";

const labels = {1:"Monster",2:"Item",3:"Spell",4:"Impact",5:"Flag",6:"Impact Monster"};
const stats = [["size","Size"],["power","Power"],["defense","Defense"],["critical","Critical"]];
const byId = id => document.getElementById(id);
const typeName = card => labels[card.type] ?? "Unclassified";
const search = byId("search");
const type = byId("type");
const sort = byId("sort");
const world = byId("world");
const pageSize = 48;
let page = 0;
const detail = byId("detail");
const storageKey = "disgrace-db-created-cards";
function savedCards() {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey) ?? "[]");
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}
const catalog = [...window.catalog, ...savedCards()];
const cards = byId("cards");
const index = new Map(catalog.map(card => [card.id, card]));

function element(tag, value, className) {
  const node = document.createElement(tag);
  node.textContent = value;
  if (className) node.className = className;
  return node;
}

const types = [...new Set(catalog.map(typeName))].sort();
type.append(...types.map(label => new Option(label, label)));
const labelKey = label => label.toLowerCase();
const cardLabels = card => [...card.collections, ...card.attributes];

function updateWorlds() {
  const selected = world.value;
  const collections = new Set(catalog.flatMap(card => card.collections));
  const attributes = new Map();
  for (const card of catalog) {
    for (const label of card.attributes) attributes.set(labelKey(label), label);
  }
  for (const label of ["STG", "REbellion", "Lightning"]) {
    if (attributes.has(labelKey(label))) attributes.set(labelKey(label), label);
  }
  world.replaceChildren(new Option("All worlds and attributes", ""));
  for (const [heading, values] of [["Worlds and collections", collections], ["Card attributes", attributes.values()]]) {
    const group = document.createElement("optgroup");
    group.label = heading;
    group.append(...[...values].sort((a, b) => a.localeCompare(b)).map(label => new Option(label, labelKey(label))));
    world.append(group);
  }
  world.value = selected;
  byId("collection-names").replaceChildren(...[...collections].sort().map(label => new Option(label, label)));
}
updateWorlds();

function artwork(card, lazy = false) {
  const frame = element("div", "", "artwork");
  const fallback = element("span", "Artwork unavailable");
  frame.append(fallback);
  if (card.image) {
    fallback.hidden = true;
    const image = document.createElement("img");
    image.alt = lazy ? "" : card.name + " card";
    image.loading = lazy ? "lazy" : "eager";
    image.decoding = "async";
    image.addEventListener("error", () => {
      image.remove();
      fallback.hidden = false;
    });
    image.src = card.image;
    frame.append(image);
  }
  return frame;
}

function render() {
  const terms = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const matches = catalog.filter(card => {
    const text = [card.name, "#" + card.id, typeName(card), ...cardLabels(card), card.effect].join(" ").toLowerCase();
    return (!type.value || typeName(card) === type.value)
      && (!world.value || cardLabels(card).some(label => labelKey(label) === world.value))
      && terms.every(term => text.includes(term));
  });
  matches.sort((a, b) => sort.value === "name" ? a.name.localeCompare(b.name) : a.id.localeCompare(b.id, undefined, { numeric: true }));
  byId("count").textContent = matches.length + (matches.length === 1 ? " card" : " cards");
  const pages = Math.ceil(matches.length / pageSize);
  byId("pagination").hidden = pages < 2;
  byId("page-status").textContent = "Page " + (page + 1) + " of " + pages;
  byId("previous").disabled = page === 0;
  byId("next").disabled = page + 1 >= pages;
  cards.replaceChildren(...matches.slice(page * pageSize, (page + 1) * pageSize).map(card => {
    const link = element("a", "", "entry type-" + card.type);
    link.href = "#card-" + card.id;
    link.append(artwork(card, true), element("span", typeName(card), "label"), element("strong", card.name), element("small", "#" + card.id));
    return link;
  }));
  if (!matches.length) cards.append(element("p", "No cards match your filters."));
}

let opener;
function showDetails() {
  const card = index.get(location.hash.slice(6));
  if (!location.hash.startsWith("#card-") || !card) {
    if (detail.open) detail.close();
    return;
  }
  const title = element("h2", card.name);
  title.id = "card-title";
  const attributes = element("dl", "", "stats");
  for (const [field, label] of stats) {
    if (card[field] === undefined || (field === "size" && ![1, 6].includes(card.type))) continue;
    const stat = element("div", "");
    stat.append(element("dt", label), element("dd", card[field].toLocaleString("en-US")));
    attributes.append(stat);
  }
  const content = byId("card-content");
  const info = element("div", "", "card-info");
  info.append(title, element("p", [typeName(card), "#" + card.id, ...card.collections].join(" · ")));
  if (card.attributes.length) info.append(element("p", card.attributes.join(" · "), "flavor"));
  if (attributes.children.length) info.append(attributes);
  if (card.effect) info.append(element("h3", "Card text"), element("p", card.effect, "effect"));
  if (card.flavor) info.append(element("p", card.flavor, "flavor"));
  content.replaceChildren(artwork(card), info);
  if (!detail.open) detail.showModal();
}

byId("filters").addEventListener("submit", event => event.preventDefault());
function resetPage() {
  page = 0;
  render();
}
byId("filters").addEventListener("input", resetPage);
byId("filters").addEventListener("reset", () => requestAnimationFrame(resetPage));
for (const [button, offset] of [["previous", -1], ["next", 1]]) {
  byId(button).addEventListener("click", () => {
    page += offset;
    render();
    byId("browse").focus();
  });
}
cards.addEventListener("click", event => {
  opener = event.target.closest("a");
});
window.addEventListener("hashchange", showDetails);
byId("close").addEventListener("click", () => detail.close());
detail.addEventListener("close", () => {
  if (location.hash.startsWith("#card-")) history.replaceState(null, "", "#collection");
  (opener ?? byId("browse")).focus();
  opener = undefined;
});

const creator = byId("creator");
const form = byId("card-form");
const newType = byId("new-type");
const feedback = byId("create-feedback");
const save = byId("save-card");
newType.append(...Object.entries(labels).map(([code, name]) => new Option(name, code)));

function updateStats() {
  const selected = Number(newType.value);
  for (const [field] of stats) {
    const input = form.elements.namedItem(field);
    const show = field === "size" || field === "defense" ? [1, 6].includes(selected) : [1, 2, 6].includes(selected);
    input.disabled = !show;
    input.parentElement.hidden = !show;
  }
}
byId("create-card").addEventListener("click", () => {
  feedback.textContent = "";
  updateStats();
  creator.showModal();
});
byId("cancel-create").addEventListener("click", () => creator.close());
newType.addEventListener("change", updateStats);

async function uploadedArtwork(file) {
  if (!file.size) return undefined;
  const bitmap = await createImageBitmap(file);
  try {
    const scale = Math.min(1, 480 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "#15111d";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.84);
  } finally {
    bitmap.close();
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (save.disabled) return;
  const data = new FormData(form);
  const name = data.get("name").trim();
  if (!name) {
    feedback.textContent = "Enter a card name.";
    return;
  }
  const attributes = new Map();
  for (const label of data.get("attributes").split(",").map(value => value.trim()).filter(Boolean)) {
    attributes.set(labelKey(label), label);
  }
  const card = {
    id: "custom-" + crypto.randomUUID(),
    name,
    type: Number(data.get("type")),
    collections: [data.get("collection").trim() || "Custom Cards"],
    attributes: [...attributes.values()],
    effect: data.get("effect").trim()
  };
  for (const [field] of stats) {
    const value = data.get(field);
    if (value) card[field] = Number(value);
  }
  save.disabled = true;
  try {
    try {
      card.image = await uploadedArtwork(data.get("art"));
    } catch {
      feedback.textContent = "The artwork could not be opened. Choose a valid image.";
      return;
    }
    try {
      localStorage.setItem(storageKey, JSON.stringify([...savedCards(), card]));
    } catch {
      feedback.textContent = "This browser could not save the card. Try a smaller image or a browser with local storage enabled.";
      return;
    }
    catalog.push(card);
    index.set(card.id, card);
    updateWorlds();
    byId("filters").reset();
    resetPage();
    form.reset();
    creator.close();
    location.hash = "card-" + card.id;
  } finally {
    save.disabled = false;
  }
});
render();
showDetails();
</script>
</body>
</html>
